name: CI

# Two CI paths:
#
# * `ci` (default-features) — uses the OxideAV org-level reusable workflow,
#   which exercises the registry-integrated path (oxideav-core dep +
#   Decoder/Encoder trait impls).
# * `ci-standalone` (no-default-features) — inline job that builds,
#   tests and clippy-checks the crate with `--no-default-features`,
#   exercising the `oxideav-core`-free standalone path (the whole
#   image-crate API contract surface: probe / info / decode* / encode*).
#   Catches regressions where a module accidentally regrows an
#   oxideav-core import. Tests that need the framework are gated on
#   `feature = "registry"` and drop out of this run.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  ci:
    uses: OxideAV/.github/.github/workflows/crate-ci.yml@master
    secrets: inherit

  ci-standalone:
    name: Build & test (no-default-features)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          key: standalone

      - name: Build (no-default-features)
        run: cargo build --no-default-features --lib --verbose

      - name: Test (no-default-features)
        run: cargo test --no-default-features --verbose

      - name: Clippy (no-default-features)
        run: cargo clippy --no-default-features --all-targets --no-deps -- -D warnings
